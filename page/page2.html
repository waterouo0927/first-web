  <h2>遊戲簡介<h2>
    <p>潛龍諜影（Metal Gear Solid）是由小島秀夫製作的動作冒險遊戲<br>首次於1998年在PlayStation平台上發行。<br>遊戲以其深刻的劇情、複雜的角色和創新的潛行玩法而聞名，成為了遊戲界的經典之作。</p>
